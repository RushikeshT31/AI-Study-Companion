<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Summary</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar"><a class="brand" href="/dashboard">🤖 AI Study Companion</a><div class="nav-links"><a href="/dashboard">Dashboard</a><a href="/quiz">Quiz</a><a href="/achievements">Achievements</a><a href="/logout">Logout</a></div></nav>
<main class="tool-page">
    <div class="page-heading"><span class="eyebrow">AI TOOL</span><h1>📝 AI Summary</h1><p>Paste your notes and get a concise revision summary.</p></div>
    <div class="two-column">
        <section class="panel">
            <h2>Study Material</h2>
            <form method="POST">
                <textarea name="text" placeholder="Paste your study material here..." required>{{ original_text }}</textarea>
                <button class="btn primary" type="submit">✨ Generate Summary</button>
            </form>
        </section>
        <section class="panel result-panel">
            <h2>📌 Summary</h2>
            {% if summary_text %}<div class="result-text">{{ summary_text }}</div>{% else %}<div class="empty-state">Your AI summary will appear here.</div>{% endif %}
        </section>
    </div>
</main>
</body>
</html>
