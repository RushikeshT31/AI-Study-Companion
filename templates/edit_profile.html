<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | AI Study Companion</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="logo">
        <b>AI Study Companion</b>
    </div>

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('profile') }}">
            👤 My Profile
        </a>

        <a href="{{ url_for('logout') }}"
           class="nav-button">
            Logout
        </a>

    </div>

</nav>


<!-- =====================================================
     EDIT PROFILE
===================================================== -->

<section class="edit-profile-container">

    <div class="edit-profile-card">


        <!-- HEADER -->

        <div class="edit-profile-header">

            <div class="edit-avatar">
                👨‍💻
            </div>

            <h1>
                ✏️ Edit Profile
            </h1>

            <p>
                Update your personal and academic information
            </p>

        </div>


        <!-- FORM -->

        <form method="POST"
              action="{{ url_for('edit_profile') }}">


            <!-- FULL NAME -->

            <div class="form-group">

                <label>
                    👤 Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ user['name'] }}"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    📧 Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ user['email'] }}"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- BIO -->

            <div class="form-group">

                <label>
                    📝 Bio
                </label>

                <textarea
                    name="bio"
                    rows="4"
                    placeholder="Write something about yourself..."
                >{{ user['bio'] or '' }}</textarea>

            </div>


            <!-- COLLEGE -->

            <div class="form-group">

                <label>
                    🎓 College Name
                </label>

                <input
                    type="text"
                    name="college"
                    value="{{ user['college'] or '' }}"
                    placeholder="Enter your college name"
                >

            </div>


            <!-- BRANCH -->

            <div class="form-group">

                <label>
                    💻 Branch
                </label>

                <input
                    type="text"
                    name="branch"
                    value="{{ user['branch'] or '' }}"
                    placeholder="Example: Computer Engineering"
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label>
                    📍 Address
                </label>

                <textarea
                    name="address"
                    rows="3"
                    placeholder="Enter your address"
                >{{ user['address'] or '' }}</textarea>

            </div>


            <!-- BUTTONS -->

            <div class="edit-profile-actions">

                <button
                    type="submit"
                    class="save-profile-btn">

                    💾 Save Profile

                </button>


                <a
                    href="{{ url_for('profile') }}"
                    class="cancel-profile-btn">

                    ❌ Cancel

                </a>

            </div>

        </form>

    </div>
</section>
</body>

</html>
