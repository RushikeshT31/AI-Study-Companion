<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Study Companion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<nav class="navbar">
    <a class="brand" href="/">🤖 AI Study Companion</a>
    <div class="nav-links"><a href="/">Home</a><a href="/login">Login</a></div>
</nav>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">📝</div>
        <h1>Create Account</h1>
        <p>Start your personalized study journey.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <button class="btn primary full" type="submit">Create Account →</button>
        </form>

        <p class="auth-bottom">Already have an account? <a href="/login">Login</a></p>
    </div>
</main>
</body>
</html>
